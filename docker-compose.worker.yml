# Remote CPU worker (docs/architecture/remote-worker.md). Runs worker.py from
# the CPU image on a host without a GPU; it only calls the API, nothing calls it.
#
#   WORKER_API_URL=https://api.example.com WORKER_TOKEN=... GEMINI_API_KEY=... \
#     docker compose -f docker-compose.worker.yml up -d --build
#
# The network below is internal to this compose project. Add host firewall
# rules so it cannot reach private ranges (the host itself, other Docker
# networks, a VPN): the worker needs the public internet only.
services:
  worker:
    build: .
    command: ["python", "-u", "worker.py"]
    working_dir: /app
    restart: unless-stopped
    environment:
      WORKER_API_URL: ${WORKER_API_URL:?set WORKER_API_URL}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      WORKER_SLOTS: ${WORKER_SLOTS:-4}
      TRANSCRIBE_BACKEND: ${TRANSCRIBE_BACKEND:-parakeet}
      AUTO_LAYOUT: ${AUTO_LAYOUT:-1}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      JOB_NICE: ${JOB_NICE:-10}
    volumes:
      - worker_output:/app/output
      - worker_uploads:/app/uploads
      - worker_models:/app/.cache
    tmpfs:
      - /tmp:size=4g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    cpus: ${WORKER_CPUS:-32}
    mem_limit: ${WORKER_MEMORY:-48g}
    healthcheck:
      disable: true
    networks: [worker]

volumes:
  worker_output:
  worker_uploads:
  worker_models:

networks:
  worker:
    driver: bridge
