# FULL lock for the CPU (the default image; torch/torchvision come from the PyTorch CPU index in the Dockerfile).
# Every Python package, direct and transitive, at an exact version. The
# Dockerfile installs it with --no-deps, so nothing unpinned gets in, and the
# build fails if requirements*.txt lists something this lock does not have.
#
# To add or bump a package: change requirements.txt / requirements-billing.txt,
# build the image without the lock and replace this file with
#   pip freeze --all --exclude pip --exclude torch --exclude torchvision
# from that image (review the diff and keep this header).
