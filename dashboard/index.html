<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/plic-logo.svg" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />

  <!-- Fonts: Lumen system (Instrument Serif display · Geist body · JetBrains Mono labels).
       Served from this origin, not fonts.googleapis.com: a Google-hosted
       stylesheet sends every visitor's IP address to a US processor before the
       page has rendered and before anyone consented to anything. See
       public/fonts.css for how the subsets were generated. -->
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Primary SEO Meta Tags -->
  <!-- Title and description are kept under 60 and 160 characters (measured, not
       eyeballed): Google truncates past roughly that width, and a truncated
       description is a worse answer than a shorter deliberate one. -->
  <title>plic.ai | AI Video Clip Maker</title>
  <meta name="description" content="Turn long videos and livestreams into vertical clips with facecam-aware framing, accurate subtitles and AI hooks. Self-hosted and powered by your own API keys." />
  <meta name="author" content="plic.ai" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <!-- Canonical must match the host actually served. The apex redirects to www,
       so pointing this at the apex named a URL that only ever redirects. -->
  <link rel="canonical" href="https://www.plic.ai/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.plic.ai/" />
  <meta property="og:title"
    content="plic.ai | AI Video Clip Maker" />
  <meta property="og:description"
    content="Create vertical 9:16 clips from long videos and livestreams, with facecam framing, subtitles and AI hooks." />
  <meta property="og:image" content="https://www.plic.ai/plic-logo.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Plic AI" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.plic.ai/" />
  <meta name="twitter:title"
    content="plic.ai | AI Video Clip Maker" />
  <meta name="twitter:description"
    content="Self-hosted AI video clipping with facecam-aware layouts, subtitles and hooks." />
  <meta name="twitter:image" content="https://www.plic.ai/plic-logo.svg" />

  <!-- JSON-LD Structured Data
       Two products, described separately and on purpose. The previous graph
       declared a single SoftwareApplication priced at 0, which is true of the
       self-hosted edition and false of the hosted one, so engines summarised the
       whole product as free. SoftwareApplication below is the MIT project;
       Service is Plic AI Cloud, with the real price range on it. -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "plic.ai",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Windows, macOS, Linux",
  "description": "Self-hosted AI video clipping that turns long videos and livestreams into vertical 9:16 clips with facecam-aware framing, word-timed subtitles and AI hooks.",
  "license": "https://opensource.org/licenses/MIT",
  "isAccessibleForFree": true,
  "featureList": [
    "AI highlight selection with Gemini or an OpenAI-compatible model",
    "Facecam above gameplay in vertical clips",
    "Word-timed subtitles",
    "AI hooks and clip titles",
    "Selected-range downloads for long YouTube videos",
    "FFmpeg rendering and clip editing"
  ]
}
</script>

  <!-- Analytics — opt-in, disabled by default, and never loaded before consent.
       A plain `npm run build` (and every local `npm run dev`) leaves the two
       VITE_OPENPANEL_* variables unset, so nothing is initialised, no script is
       fetched and no request leaves the browser. Self-hosted instances are
       silent unless you deliberately turn this on.

       Nothing here RUNS on page load any more: it only publishes
       window.__osAnalyticsInit, and the React consent manager
       (src/lib/consent.js) calls it once the visitor has actually accepted the
       analytics category. Loading a tracker in the static <head> and asking
       afterwards is the exact pattern LSSI art. 22.2 forbids.

       op1.js is served from this origin (public/op1.js), not from
       openpanel.dev: a third-party script sees the visitor's IP and can be
       changed under us at any time.

       To collect analytics for your own deployment: point
       VITE_OPENPANEL_API_URL / VITE_OPENPANEL_CLIENT_ID at your own OpenPanel
       instance (see .env.example) and add your hostname to ANALYTICS_HOSTS. -->
    <script>
      window.op = window.op || function () { var n = []; return new Proxy(function () { arguments.length && n.push([].slice.call(arguments)); }, { get: function (t, r) { return "q" === r ? n : function () { n.push([r].concat([].slice.call(arguments))); }; }, has: function (t, r) { return "q" === r; } }); }();
      window.__osAnalyticsInit = (function () {
        var started = false;
        return function () {
          if (started) return false;
          // Vite substitutes these at build time and leaves the placeholder literal
          // in place when the variable is undefined.
          var apiUrl = "%VITE_OPENPANEL_API_URL%";
          var clientId = "%VITE_OPENPANEL_CLIENT_ID%";
          var unset = function (v) { return !v || v.charAt(0) === "%"; };
          if (unset(apiUrl) || unset(clientId)) return false;

          // Second gate: hosts allowed to report. A dist/ built with credentials
          // stays inert anywhere else (a fork, a mirror, a preview domain), so a
          // deployment can never report into somebody else's dashboard.
          var ANALYTICS_HOSTS = /^(www\.)?plic\.app$/;
          if (!ANALYTICS_HOSTS.test(location.hostname)) return false;

          started = true;
          window.op("init", {
            apiUrl: apiUrl,
            clientId: clientId,
            trackScreenViews: true,
            trackOutgoingLinks: true,
            trackAttributes: true,
          });

          var s = document.createElement("script");
          s.src = "/op1.js";
          s.defer = true;
          s.async = true;
          document.head.appendChild(s);
          return true;
        };
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
